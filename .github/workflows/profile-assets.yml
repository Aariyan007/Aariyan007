name: Generate profile assets

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/**"
      - ".github/workflows/profile-assets.yml"

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Activity graph and contribution heatmap
        env:
          GH_USER: ${{ github.repository_owner }}
          # Add a PROFILE_TOKEN secret (classic PAT, read:user) to include private contributions.
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}
        run: python .github/scripts/activity_graph.py dist

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
